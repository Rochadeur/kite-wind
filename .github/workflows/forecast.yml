name: Vorhersage aktualisieren

on:
  schedule:
    # stündlich: neue DWD-Läufe kommen gestaffelt, und GitHub startet geplante Läufe oft mit Verspätung
    - cron: "10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_icon.py --out web/data
      # DMI HARMONIE + ECMWF über Open-Meteo; ein Ausfall soll die ICON-Daten nicht blockieren
      - run: python fetch_openmeteo.py --out web/data
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
