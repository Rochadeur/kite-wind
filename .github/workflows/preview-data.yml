# Nur für die Vorschau auf dem Arbeitszweig: holt alle Modelle und gibt die Daten im Log aus.
# Wird vor dem Zusammenführen wieder gelöscht.
name: Vorschau-Daten

on:
  push:
    branches: [claude/project-thread-ndbqqp]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_openmeteo.py --out web/data
      - run: python fetch_icon.py --out web/data
      - name: Daten ausgeben
        run: |
          ls -la web/data
          python -c "import json; d=json.load(open('web/data/gold.dmi.json')); print(d['run'], len(d['rows']), d['rows'][:3])"
          python -c "import json; d=json.load(open('web/data/gold.ecmwf.json')); print(d['run'], len(d['rows']), d['rows'][:3])"
          echo "BEGIN-DATA"
          tar -C web/data -czf - . | base64 -w 2000
          echo "END-DATA"
