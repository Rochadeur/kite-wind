<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kite-Wind</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#6b7280; --line:#e3e6ea; --card:#fff; --sep:#b8bec7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --fg:#e8eaed; --muted:#9aa0a6; --line:#2a2f36; --card:#181c21; --sep:#4a525c; } }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  button.on { background:var(--fg); color:var(--bg); }
  .opt { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .help { margin-left:auto; color:var(--fg); }
  .meta { color:var(--muted); padding:0 16px 8px; }
  .wrap { overflow-x:auto; margin:0 16px 24px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:4px 0; min-width:34px; text-align:center; border-left:1px solid var(--line); }
  th:first-child, td:first-child { position:sticky; left:0; background:var(--card); text-align:left; padding:4px 10px; min-width:96px; color:var(--muted); font-weight:500; border-left:0; z-index:1; }
  tr.day th { font-weight:600; border-bottom:1px solid var(--line); }
  td.w { font-weight:600; color:#111; }
  /* Trennlinie vor jedem neuen Tag */
  th.ds, td.ds { border-left:2px solid var(--sep); }
  /* Windfinder-Stil: gefüllter Pfeil, zeigt wohin der Wind weht */
  .dir { display:flex; flex-direction:column; align-items:center; gap:1px; }
  .dir svg { width:20px; height:20px; fill:var(--fg); }
  .dir small { font-size:10px; color:var(--muted); line-height:1; }
</style>
</head>
<body>
<header>
  <h1>Kite-Wind</h1>
  <select id="spot"></select>
  <span id="models"></span>
  <label class="opt"><input type="checkbox" id="allHours"> Alle Stunden</label>
  <a class="help" href="hilfe.html">Hilfe</a>
</header>
<div class="meta" id="meta"></div>
<div class="wrap"><table id="tbl"></table></div>
<script>
const MODELS = { "icon-d2": "ICON-D2 (2 km)", "icon-eu": "ICON-EU (7 km)" };
let spots = [], spot, model = "icon-d2";

// Windguru-ähnliche Skala in Knoten
const SCALE = [[0,"#ffffff"],[5,"#c6ecff"],[10,"#7fd3ff"],[14,"#5ef09a"],[18,"#f5f55a"],[22,"#ffb340"],[27,"#ff5a3c"],[33,"#e0218a"],[40,"#9b30d9"]];
const color = kn => SCALE.reduce((c, [k, col]) => kn >= k ? col : c, SCALE[0][1]);
const DAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const COMPASS = ["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = deg => COMPASS[Math.round(deg / 22.5) % 16];
// Pfeilspitze mit Kerbe, um 180° gedreht: Windrichtung "kommt aus" -> Pfeil zeigt "weht nach"
const arrow = deg => `<span class="dir" title="${Math.round(deg)}° (${compass(deg)})"><svg viewBox="0 0 24 24" style="transform:rotate(${deg + 180}deg)"><path d="M12 2 L17 21 L12 17 L7 21 Z"/></svg><small>${compass(deg)}</small></span>`;
// Sonnenauf-/untergang (NOAA-Näherung, ±1-2 min) für Datum t und Ort -> [Aufgang, Untergang] in ms
function sunTimes(t, lat, lon) {
  const rad = Math.PI / 180, jd = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate(), 12) / 864e5 + 2440587.5;
  const j = Math.floor(jd - 2451545 + 0.0008) - lon / 360;
  const M = (357.5291 + 0.98560028 * j) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 282.9372) % 360;
  const transit = 2451545 + j + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.44 * rad));
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec))) / rad;
  const ms = jdn => (jdn - 2440587.5) * 864e5;
  return [ms(transit - w / 360), ms(transit + w / 360)];
}
let allHours = false;
try { allHours = localStorage.getItem("allHours") === "1"; } catch {}
const local = iso => new Date(iso.replace("Z", ":00Z"));

async function load() {
  const r = await fetch(`data/${spot.id}.${model}.json`);
  if (!r.ok) { document.getElementById("meta").textContent = "Keine Daten für diesen Spot/Modell."; return; }
  render(await r.json());
}

function render(d) {
  const now = Date.now() - 3600e3;
  // Standard: von der Stunde des Sonnenaufgangs bis zur ersten Stunde nach Sonnenuntergang
  const daylight = t => { const [rise, set] = sunTimes(t, d.spot.lat, d.spot.lon); return t > rise - 3600e3 && t < set + 3600e3; };
  const rows = d.rows.filter(r => local(r.t) >= now && (allHours || daylight(local(r.t))));
  document.getElementById("meta").textContent =
    `${d.spot.region} · ${d.spot.name} · ${MODELS[d.model]} · Lauf ${local(d.run).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})} · Gitterpunkt nahe ${d.spot.lat.toFixed(2)}°N ${d.spot.lon.toFixed(2)}°E`;
  // Tageskopf
  const days = [];
  for (const r of rows) {
    const t = local(r.t), key = t.toDateString();
    if (!days.length || days.at(-1).key !== key) days.push({ key, label: `${DAYS[t.getDay()]} ${t.getDate()}.${t.getMonth()+1}.`, n: 0, first: rows.indexOf(r) });
    days.at(-1).n++;
  }
  const starts = new Set(days.slice(1).map(d => d.first));
  const line = (label, f, cls = "") => `<tr><td>${label}</td>${rows.map((r, i) => `<td class="${cls}${starts.has(i) ? " ds" : ""}" ${f.style ? `style="${f.style(r)}"` : ""}>${f.v(r)}</td>`).join("")}</tr>`;
  document.getElementById("tbl").innerHTML =
    `<tr class="day"><th></th>${days.map((d, i) => `<th colspan="${d.n}"${i ? ' class="ds"' : ""}>${d.label}</th>`).join("")}</tr>` +
    line("Uhrzeit", { v: r => local(r.t).getHours() + "h" }) +
    line("Wind (kn)", { v: r => Math.round(r.wind), style: r => `background:${color(r.wind)}` }, "w") +
    line("Böen (kn)", { v: r => Math.round(r.gust), style: r => `background:${color(r.gust)}` }, "w") +
    line("Richtung", { v: r => arrow(r.dir) }) +
    line("Temp. (°C)", { v: r => Math.round(r.temp) }) +
    line("Wolken (%)", { v: r => r.cloud }) +
    line("Regen (mm)", { v: r => r.rain >= 0.1 ? r.rain : "" });
}

async function init() {
  spots = await (await fetch("data/spots.json")).json();
  const sel = document.getElementById("spot");
  // Spots nach Region gruppiert, Reihenfolge wie in spots.json
  const regions = [...new Set(spots.map(s => s.region))];
  sel.innerHTML = regions.map(g => `<optgroup label="${g}">${spots.filter(s => s.region === g)
    .map(s => `<option value="${s.id}">${s.name}</option>`).join("")}</optgroup>`).join("");
  sel.onchange = () => { spot = spots.find(s => s.id === sel.value); try { localStorage.setItem("spot", spot.id); } catch {} load(); };
  const m = document.getElementById("models");
  m.innerHTML = Object.entries(MODELS).map(([k, v]) => `<button data-m="${k}">${v}</button>`).join(" ");
  m.onclick = e => { if (!e.target.dataset.m) return; model = e.target.dataset.m; mark(); load(); };
  const mark = () => m.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.m === model));
  const ah = document.getElementById("allHours");
  ah.checked = allHours;
  ah.onchange = () => { allHours = ah.checked; try { localStorage.setItem("allHours", allHours ? "1" : "0"); } catch {} load(); };
  let saved; try { saved = localStorage.getItem("spot"); } catch {}
  spot = spots.find(s => s.id === saved) || spots[0]; sel.value = spot.id; mark(); load();
}
init();
</script>
</body>
</html>
