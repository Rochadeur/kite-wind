<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windlotse · Kitewind Ostsee</title>
<meta name="apple-mobile-web-app-title" content="Windlotse">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a64f0">
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#6b7280; --line:#e3e6ea; --card:#fff; --sep:#b8bec7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --fg:#e8eaed; --muted:#9aa0a6; --line:#2a2f36; --card:#181c21; --sep:#4a525c; } }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  button.on { background:var(--fg); color:var(--bg); }
  .opt { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .help { margin-left:auto; color:var(--fg); }
  .meta { color:var(--muted); padding:0 16px 8px; }
  .box { position:relative; margin:0 16px 24px; }
  .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:8px; scroll-behavior:smooth; }
  /* Schatten am Rand und Pfeil-Knöpfe zeigen, dass die Tabelle seitlich weitergeht */
  .box::before, .box::after { content:""; position:absolute; top:1px; bottom:1px; width:28px; pointer-events:none; opacity:0; transition:opacity .2s; z-index:2; }
  .box::before { left:var(--stick, 117px); background:linear-gradient(to right, rgba(0,0,0,.22), transparent); }
  .box::after { right:1px; border-radius:0 8px 8px 0; background:linear-gradient(to left, rgba(0,0,0,.22), transparent); }
  .box.more-l::before, .box.more-r::after { opacity:1; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); z-index:3; width:36px; height:36px; padding:0; border-radius:50%;
         font-size:20px; line-height:1; box-shadow:0 1px 4px rgba(0,0,0,.3); display:none; cursor:pointer; }
  .nav.prev { left:calc(var(--stick, 117px) + 6px); }
  .nav.next { right:6px; }
  .box.more-l .nav.prev, .box.more-r .nav.next { display:block; }
  @media (prefers-reduced-motion: reduce) { .wrap { scroll-behavior:auto; } }
  table { border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:4px 0; min-width:34px; text-align:center; border-left:1px solid var(--line); }
  th:first-child, td:first-child { position:sticky; left:0; background:var(--card); text-align:left; padding:4px 10px; min-width:96px; color:var(--muted); font-weight:500; border-left:0; z-index:1; }
  tr.day th { font-weight:600; border-bottom:1px solid var(--line); }
  /* Windzeile als Balken (Windfinder-Stil): Höhe/Farbe = Wind, Strich darüber = Böe */
  td.bar { vertical-align:bottom; padding:0; height:84px; position:relative; }
  td.bar .b { position:absolute; left:2px; right:2px; bottom:0; }
  td.bar .g { position:absolute; left:4px; right:4px; height:3px; }
  td.bar span { position:relative; font-weight:600; font-size:12px; display:block; padding-bottom:2px; color:#111; }
  td.bar span.dk { color:#fff; }
  td.gu { font-weight:600; }
  /* Trennlinie vor jedem neuen Tag */
  th.ds, td.ds { border-left:2px solid var(--sep); }
  /* Windfinder-Stil: gefüllter Pfeil, zeigt wohin der Wind weht */
  .dir { display:flex; flex-direction:column; align-items:center; gap:1px; }
  .dir svg { width:20px; height:20px; fill:var(--fg); }
  .dir small { font-size:10px; color:var(--muted); line-height:1; }
  /* Handy hochkant: Tage als aufklappbare Liste, Stunden untereinander (quer: Tabelle wie am Computer) */
  #list { display:none; margin:0 12px 24px; }
  @media (max-width: 640px) and (orientation: portrait) {
    .box { display:none; }
    #list { display:flex; flex-direction:column; gap:8px; }
    header { padding:12px; gap:8px; }
    .meta { padding:0 12px 8px; font-size:12px; }
  }
  .day-card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .day-card .sum { padding:10px 12px; display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:center; }
  .day-card .dl { font-weight:600; }
  .day-card .best { color:var(--muted); font-size:13px; text-align:right; }
  .day-card .best b { color:var(--fg); }
  .strip { grid-column:1 / span 2; display:flex; height:8px; border-radius:4px; overflow:hidden; }
  .strip i { flex:1; }
  .hr { display:grid; grid-template-columns:30px 28px 1fr 50px 28px 28px; gap:6px; align-items:center; padding:3px 12px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .hr.head { font-size:11px; color:var(--muted); padding-block:4px; }
  .hr .t { color:var(--muted); }
  .hr .w { position:relative; height:24px; }
  .hr .w .b { position:absolute; left:0; top:2px; bottom:2px; border-radius:3px; min-width:24px; display:flex; align-items:center; justify-content:flex-end; padding-right:5px; box-sizing:border-box; font-weight:600; font-size:13px; color:#111; }
  .hr .w .b.dk { color:#fff; }
  .hr .w .g { position:absolute; top:0; bottom:0; width:3px; border-radius:1px; }
  .hr .gn { text-align:center; font-size:12px; font-weight:600; border-radius:3px; line-height:20px; color:#111; }
  .hr .gn.dk { color:#fff; }
  .hr .dir { flex-direction:row; gap:3px; }
  .hr .dir small { font-size:11px; }
  .hr .n { text-align:right; font-size:13px; }
  .hr .rain { color:#3c90f0; }
</style>
</head>
<body>
<header>
  <h1>Windlotse</h1>
  <select id="spot"></select>
  <span id="models"></span>
  <label class="opt"><input type="checkbox" id="allHours"> Alle Stunden</label>
  <a class="help" href="hilfe.html">Hilfe</a>
</header>
<div class="meta" id="meta"></div>
<div class="box" id="box">
  <button class="nav prev" id="prev" title="Vorheriger Tag" aria-label="Vorheriger Tag">‹</button>
  <div class="wrap" id="wrap"><table id="tbl"></table></div>
  <button class="nav next" id="next" title="Nächster Tag" aria-label="Nächster Tag">›</button>
</div>
<div id="list"></div>
<script>
const MODELS = { "icon-d2": "ICON-D2 (2 km)", "icon-eu": "ICON-EU (7 km)" };
let spots = [], spot, model = "icon-d2";

// Windfinder-ähnliche Skala in Knoten (Farben aus Screenshot, Knotenwerte geschätzt), dazwischen fließend
const SCALE = [[0,"#1838e8"],[4,"#2a64f0"],[7,"#3c90f0"],[9,"#54c0f8"],[11,"#66dcea"],[13,"#58b490"],[15,"#60d040"],
               [17,"#6cf048"],[19,"#c4fc78"],[21,"#f8dc48"],[24,"#f0a030"],[27,"#e85030"],[31,"#d02060"],[35,"#a020a0"]];
const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const isDark = col => { const [r, g, b] = hex(col); return 0.299 * r + 0.587 * g + 0.114 * b < 140; };
function color(kn) {
  for (let i = 1; i < SCALE.length; i++) if (kn < SCALE[i][0]) {
    const [k0, c0] = SCALE[i - 1], [k1, c1] = SCALE[i], f = (kn - k0) / (k1 - k0), a = hex(c0), b = hex(c1);
    return "#" + a.map((v, j) => Math.round(v + (b[j] - v) * f).toString(16).padStart(2, "0")).join("");
  }
  return SCALE.at(-1)[1];
}
const PX_PER_KN = 2.2;
const DAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const COMPASS = ["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = deg => COMPASS[Math.round(deg / 22.5) % 16];
// Pfeilspitze mit Kerbe, um 180° gedreht: Windrichtung "kommt aus" -> Pfeil zeigt "weht nach"
const arrow = deg => `<span class="dir" title="${Math.round(deg)}° (${compass(deg)})"><svg viewBox="0 0 24 24" style="transform:rotate(${deg + 180}deg)"><path d="M12 2 L17 21 L12 17 L7 21 Z"/></svg><small>${compass(deg)}</small></span>`;
// Sonnenauf-/untergang (NOAA-Näherung, ±1-2 min) für Datum t und Ort -> [Aufgang, Untergang] in ms
function sunTimes(t, lat, lon) {
  const rad = Math.PI / 180, jd = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate(), 12) / 864e5 + 2440587.5;
  const j = Math.floor(jd - 2451545 + 0.0008) - lon / 360;
  const M = (357.5291 + 0.98560028 * j) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 282.9372) % 360;
  const transit = 2451545 + j + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.44 * rad));
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec))) / rad;
  const ms = jdn => (jdn - 2440587.5) * 864e5;
  return [ms(transit - w / 360), ms(transit + w / 360)];
}
let allHours = false;
try { allHours = localStorage.getItem("allHours") === "1"; } catch {}
const local = iso => new Date(iso.replace("Z", ":00Z"));

async function load() {
  document.title = `${spot.name} · Windlotse`;
  // no-cache: Browser (v. a. Safari) sollen nicht die alte Datei aus dem Zwischenspeicher nehmen
  const r = await fetch(`data/${spot.id}.${model}.json`, { cache: "no-cache" });
  if (!r.ok) { document.getElementById("meta").textContent = "Keine Daten für diesen Spot/Modell."; return; }
  render(await r.json());
}

function render(d) {
  const now = Date.now() - 3600e3;
  // Standard: von der Stunde des Sonnenaufgangs bis zur ersten Stunde nach Sonnenuntergang
  const daylight = t => { const [rise, set] = sunTimes(t, d.spot.lat, d.spot.lon); return t > rise - 3600e3 && t < set + 3600e3; };
  const rows = d.rows.filter(r => local(r.t) >= now && (allHours || daylight(local(r.t))));
  document.getElementById("meta").textContent =
    `${d.spot.name} · ${MODELS[d.model]} · Modelllauf ${local(d.run).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}${d.fetched ? `, abgerufen ${local(d.fetched).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}` : ""} · Gitterpunkt nahe ${d.spot.lat.toFixed(2)}°N ${d.spot.lon.toFixed(2)}°E`;
  // Tageskopf
  const days = [];
  for (const r of rows) {
    const t = local(r.t), key = t.toDateString();
    if (!days.length || days.at(-1).key !== key) days.push({ key, label: `${DAYS[t.getDay()]} ${t.getDate()}.${t.getMonth()+1}.`, n: 0, first: rows.indexOf(r) });
    days.at(-1).n++;
  }
  const starts = new Set(days.slice(1).map(d => d.first));
  const line = (label, f, cls = "") => `<tr><td>${label}</td>${rows.map((r, i) => `<td class="${cls}${starts.has(i) ? " ds" : ""}" ${f.style ? `style="${f.style(r)}"` : ""}>${f.v(r)}</td>`).join("")}</tr>`;
  document.getElementById("tbl").innerHTML =
    `<tr class="day"><th></th>${days.map((d, i) => `<th colspan="${d.n}"${i ? ' class="ds"' : ""}>${d.label}</th>`).join("")}</tr>` +
    line("Uhrzeit", { v: r => local(r.t).getHours() + "h" }) +
    `<tr><td>Wind (kn)</td>${rows.map((r, i) => {
      const h = Math.max(Math.min(r.wind, 35) * PX_PER_KN, 16), g = Math.min(r.gust, 35) * PX_PER_KN, c = color(r.wind);
      return `<td class="bar${starts.has(i) ? " ds" : ""}"><div class="b" style="height:${h}px;background:${c}"></div>` +
        `<div class="g" style="bottom:${g}px;background:${color(r.gust)}"></div><span class="${isDark(c) ? "dk" : ""}">${Math.round(r.wind)}</span></td>`;
    }).join("")}</tr>` +
    line("Böen (kn)", { v: r => Math.round(r.gust), style: r => `background:${color(r.gust)};color:${isDark(color(r.gust)) ? "#fff" : "#111"}` }, "gu") +
    line("Richtung", { v: r => arrow(r.dir) }) +
    line("Temp. (°C)", { v: r => Math.round(r.temp) }) +
    line("Wolken (%)", { v: r => r.cloud }) +
    line("Regen (mm)", { v: r => r.rain >= 0.1 ? r.rain : "" });
  renderList(rows, days);
  edges();
}

// Zeigt Schatten/Knöpfe nur, wenn es in die Richtung noch etwas zu sehen gibt
const wrap = document.getElementById("wrap"), box = document.getElementById("box");
function edges() {
  const first = wrap.querySelector("td");
  if (first) box.style.setProperty("--stick", first.offsetWidth + 1 + "px");
  box.classList.toggle("more-l", wrap.scrollLeft > 2);
  box.classList.toggle("more-r", wrap.scrollLeft + wrap.clientWidth < wrap.scrollWidth - 2);
}
// Springt zum Anfang des nächsten/vorherigen Tages
function jump(dir) {
  const stick = wrap.querySelector("td").offsetWidth;
  const starts = [...wrap.querySelectorAll("tr.day th")].slice(1).map(th => th.offsetLeft - stick);
  starts.unshift(0);
  const x = wrap.scrollLeft;
  const target = dir > 0 ? starts.find(s => s > x + 2) : starts.filter(s => s < x - 2).at(-1);
  wrap.scrollLeft = target ?? (dir > 0 ? wrap.scrollWidth : 0);
}
wrap.addEventListener("scroll", edges, { passive: true });
window.addEventListener("resize", edges);
document.getElementById("prev").onclick = () => jump(-1);
document.getElementById("next").onclick = () => jump(1);

// Handy-Ansicht: pro Tag ein Kopf mit stärkster Windphase, darunter alle Stunden
function renderList(rows, days) {
  const list = document.getElementById("list");
  list.innerHTML = days.map(d => {
    const hrs = rows.slice(d.first, d.first + d.n);
    // stärkste Phase: längster zusammenhängender Block mit höchstens 2 kn unter dem Tagesmaximum
    let m = 0; hrs.forEach((r, i) => { if (r.wind > hrs[m].wind) m = i; });
    const lim = hrs[m].wind - 2;
    let a = m, b = m;
    for (let i = 0, j; i < hrs.length; i = j + 1) {
      j = i; if (hrs[i].wind < lim) continue;
      while (j < hrs.length - 1 && hrs[j + 1].wind >= lim) j++;
      if (j - i > b - a) { a = i; b = j; }
    }
    const h = i => local(hrs[i].t).getHours();
    const phase = a === b ? `${h(a)} Uhr` : `${h(a)}–${h(b)} Uhr`;
    return `<section class="day-card">
      <div class="sum"><span class="dl">${d.label}</span>
        <span class="best"><b>${Math.round(hrs[m].wind)} kn</b> (Böen ${Math.round(hrs[m].gust)}) · ${compass(hrs[m].dir)} · ${phase}</span>
        <span class="strip">${hrs.map(r => `<i style="background:${color(r.wind)}"></i>`).join("")}</span></div>
      <div class="hr head"><span>Zeit</span><span>Böe</span><span>Wind (kn)</span><span>Richtung</span><span class="n">°C</span><span class="n">mm</span></div>
      ${hrs.map(r => {
        const c = color(r.wind), wp = Math.min(r.wind, 35) / 35 * 100, gp = Math.min(r.gust, 35) / 35 * 100;
        return `<div class="hr"><span class="t">${local(r.t).getHours()}h</span>
          <span class="gn${isDark(color(r.gust)) ? " dk" : ""}" style="background:${color(r.gust)}">${Math.round(r.gust)}</span>
          <span class="w"><span class="b${isDark(c) ? " dk" : ""}" style="width:${wp}%;background:${c}">${Math.round(r.wind)}</span>
            <span class="g" style="left:calc(${gp}% - 1px);background:${color(r.gust)}"></span></span>
          ${arrow(r.dir)}<span class="n">${Math.round(r.temp)}</span><span class="n rain">${r.rain >= 0.1 ? r.rain : ""}</span></div>`;
      }).join("")}
    </section>`;
  }).join("");
}

async function init() {
  spots = await (await fetch("data/spots.json", { cache: "no-cache" })).json();
  const sel = document.getElementById("spot");
  // Spot-Liste: zuletzt genutzte Spots oben (neuester zuerst), danach alle übrigen alphabetisch
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem("recent") || "[]"); } catch {}
  try { const old = localStorage.getItem("spot"); if (old && !recent.length) recent = [old]; } catch {}
  recent = recent.filter(id => spots.some(s => s.id === id));
  const fillSpots = () => {
    const rest = spots.filter(s => !recent.includes(s.id)).sort((a, b) => a.name.localeCompare(b.name, "de"));
    const opt = s => `<option value="${s.id}">${s.name}</option>`;
    sel.innerHTML = recent.map(id => opt(spots.find(s => s.id === id))).join("") +
      (recent.length ? `<option disabled>──────────</option>` : "") + rest.map(opt).join("");
  };
  const use = id => {
    recent = [id, ...recent.filter(r => r !== id)];
    try { localStorage.setItem("recent", JSON.stringify(recent)); } catch {}
    spot = spots.find(s => s.id === id); fillSpots(); sel.value = id;
  };
  sel.onchange = () => { use(sel.value); load(); };
  const m = document.getElementById("models");
  m.innerHTML = Object.entries(MODELS).map(([k, v]) => `<button data-m="${k}">${v}</button>`).join(" ");
  m.onclick = e => { if (!e.target.dataset.m) return; model = e.target.dataset.m; mark(); load(); };
  const mark = () => m.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.m === model));
  const ah = document.getElementById("allHours");
  ah.checked = allHours;
  ah.onchange = () => { allHours = ah.checked; try { localStorage.setItem("allHours", allHours ? "1" : "0"); } catch {} load(); };
  fillSpots(); spot = spots.find(s => s.id === sel.value); mark(); load();
}
init();
</script>
</body>
</html>
